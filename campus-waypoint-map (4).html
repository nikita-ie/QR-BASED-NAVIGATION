<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Waypoint — Campus Delivery Map</title>

<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css" />
<script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700;800&family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">

<style>
  :root{
    --bg:#0B1220;
    --panel:#131B2E;
    --panel-light:#1B2540;
    --border:#26324A;
    --text:#E8ECF4;
    --text-dim:#8993AB;
    --accent:#F5A623;
    --teal:#2DD4BF;
    --radius:10px;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;height:100%;background:var(--bg);color:var(--text);font-family:'Inter',sans-serif;}
  #app{display:flex;flex-direction:column;height:100vh;}

  #topbar{
    display:flex;align-items:center;gap:14px;
    padding:0 22px;height:66px;flex:0 0 66px;
    background:var(--panel);border-bottom:1px solid var(--border);
    z-index:20;flex-wrap:nowrap;
  }
  .wordmark{
    font-family:'Barlow Condensed',sans-serif;font-weight:800;
    font-size:26px;letter-spacing:1px;color:var(--text);
    display:flex;align-items:center;gap:8px;white-space:nowrap;
  }
  .wordmark .dot{width:9px;height:9px;border-radius:2px;background:var(--accent);display:inline-block;transform:rotate(45deg);}
  .tagline{font-size:11px;color:var(--text-dim);letter-spacing:.5px;text-transform:uppercase;margin-top:2px;display:block;}
  .wordmark-wrap{display:flex;flex-direction:column;gap:0;line-height:1;margin-right:8px;}

  #searchbox{flex:1;display:flex;gap:8px;max-width:360px;}
  #searchbox input{
    flex:1;background:var(--panel-light);border:1px solid var(--border);
    color:var(--text);padding:9px 12px;border-radius:8px;font-size:13.5px;font-family:'Inter',sans-serif;
  }
  #searchbox input:focus{outline:none;border-color:var(--accent);}
  #searchbox button, .btn{
    background:var(--panel-light);border:1px solid var(--border);color:var(--text);
    padding:9px 14px;border-radius:8px;font-size:13px;font-weight:500;cursor:pointer;
    font-family:'Inter',sans-serif;white-space:nowrap;transition:.15s;
  }
  #searchbox button:hover, .btn:hover{border-color:var(--accent);color:var(--accent);}
  .btn-accent{background:var(--accent);border-color:var(--accent);color:#1a1200;font-weight:600;}
  .btn-accent:hover{background:#ffb84d;color:#1a1200;}
  .btn-accent.active{background:#ffb84d;box-shadow:0 0 0 3px rgba(245,166,35,.25);}
  .btn:disabled{opacity:.4;cursor:not-allowed;}
  .btn:disabled:hover{border-color:var(--border);color:var(--text);}

  #topbar-right{display:flex;gap:8px;margin-left:auto;align-items:center;}
  #status-msg{font-size:12px;color:var(--text-dim);margin-left:2px;max-width:200px;}
  #owner-btn{border-color:var(--teal);color:var(--teal);}
  #owner-btn.is-owner{background:var(--teal);color:#04211d;border-color:var(--teal);}

  #main{flex:1;display:flex;min-height:0;}
  #map{flex:1;position:relative;background:#0d1424;}
  #map-hint{
    position:absolute;bottom:16px;left:50%;transform:translateX(-50%);
    background:rgba(19,27,46,.95);border:1px solid var(--accent);color:var(--text);
    padding:8px 16px;border-radius:20px;font-size:12.5px;z-index:500;
    display:none;box-shadow:0 4px 20px rgba(0,0,0,.4);
  }
  #viewer-banner{
    position:absolute;top:12px;left:50%;transform:translateX(-50%);
    background:rgba(19,27,46,.95);border:1px solid var(--border);color:var(--text-dim);
    padding:6px 14px;border-radius:20px;font-size:11.5px;z-index:500;display:none;
  }

  #sidebar{
    width:360px;flex:0 0 360px;background:var(--panel);border-left:1px solid var(--border);
    display:flex;flex-direction:column;min-height:0;
  }
  #sidebar-head{padding:16px 18px 10px;border-bottom:1px solid var(--border);}
  #sidebar-head h2{font-family:'Barlow Condensed',sans-serif;font-size:19px;font-weight:700;margin:0 0 2px;letter-spacing:.3px;}
  #sidebar-head p{margin:0;font-size:12px;color:var(--text-dim);}
  #wp-list{flex:1;overflow-y:auto;padding:14px;display:flex;flex-direction:column;gap:12px;}
  #sidebar-foot{padding:12px 14px;border-top:1px solid var(--border);display:flex;gap:8px;}
  #sidebar-foot .btn{flex:1;}

  #empty-state{padding:30px 18px;text-align:center;color:var(--text-dim);font-size:13px;line-height:1.6;}
  #empty-state b{color:var(--text);}

  .ticket{
    position:relative;background:var(--panel-light);border:1px solid var(--border);border-radius:var(--radius);
    display:flex;overflow:hidden;
  }
  .ticket .stripe{width:6px;flex:0 0 6px;}
  .ticket-body{flex:1;padding:12px;display:flex;gap:12px;min-width:0;}
  .ticket-info{flex:1;min-width:0;}
  .ticket-code{font-family:'JetBrains Mono',monospace;font-size:10.5px;color:var(--text-dim);letter-spacing:.5px;}
  .ticket-name{font-size:14.5px;font-weight:600;margin:2px 0 4px;color:var(--text);word-break:break-word;}
  .ticket-cat{
    display:inline-block;font-size:10px;font-weight:600;letter-spacing:.4px;text-transform:uppercase;
    padding:2px 7px;border-radius:20px;margin-bottom:6px;
  }
  .ticket-coords{font-family:'JetBrains Mono',monospace;font-size:10.5px;color:var(--text-dim);}
  .ticket-actions{display:flex;gap:6px;margin-top:8px;flex-wrap:wrap;}
  .ticket-actions button{
    background:none;border:1px solid var(--border);color:var(--text-dim);font-size:10.5px;
    padding:4px 8px;border-radius:6px;cursor:pointer;font-family:'Inter',sans-serif;
  }
  .ticket-actions button:hover{color:var(--accent);border-color:var(--accent);}
  .ticket-actions button.danger:hover{color:#f43f5e;border-color:#f43f5e;}
  .ticket-dist{color:var(--teal);font-weight:600;}
  .btn-dir{background:var(--accent);color:#1a1200 !important;font-weight:700;border:none;padding:5px 9px;border-radius:6px;font-size:10.5px;text-decoration:none;display:inline-flex;align-items:center;gap:4px;font-family:'Inter',sans-serif;}
  .btn-dir:hover{background:#ffb84d;}

  .edit-row{margin-bottom:8px;}
  .edit-row label{font-size:10px;color:var(--text-dim);text-transform:uppercase;letter-spacing:.4px;display:block;margin-bottom:3px;}
  .edit-row input, .edit-row select{
    width:100%;background:var(--panel);border:1px solid var(--border);color:var(--text);
    padding:6px 8px;border-radius:6px;font-size:13px;font-family:'Inter',sans-serif;
  }
  .cat-chips{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:10px;}
  .cat-chip{
    border:1px solid var(--border);background:var(--panel-light);color:var(--text-dim);
    font-size:11.5px;padding:6px 10px;border-radius:20px;cursor:pointer;font-family:'Inter',sans-serif;
    transition:background .15s,border-color .15s,color .15s;
  }
  .cat-chip.active{background:var(--accent);color:#1a1200;border-color:var(--accent);font-weight:600;}
  .cat-chip:hover{border-color:var(--accent);}

  #add-form{
    position:absolute;left:50%;bottom:20px;margin-left:-150px;
    background:var(--panel);border:1px solid var(--accent);border-radius:12px;
    padding:16px;width:300px;z-index:600;box-shadow:0 10px 40px rgba(0,0,0,.5);
    display:none;
  }
  #add-form h3{margin:0 0 10px;font-family:'Barlow Condensed',sans-serif;font-size:17px;font-weight:700;}
  #add-form label{font-size:11px;color:var(--text-dim);display:block;margin-bottom:4px;text-transform:uppercase;letter-spacing:.4px;}
  #add-form input, #add-form select{
    width:100%;background:var(--panel-light);border:1px solid var(--border);color:var(--text);
    padding:8px 10px;border-radius:7px;font-size:13.5px;margin-bottom:10px;font-family:'Inter',sans-serif;
  }
  #add-form .row{display:flex;gap:8px;}
  #add-form .row .btn{flex:1;text-align:center;}
  .coord-preview{font-family:'JetBrains Mono',monospace;font-size:11px;color:var(--teal);margin-bottom:10px;}

  .wp-pin{width:26px;height:26px;border-radius:50% 50% 50% 0;transform:rotate(-45deg);
    display:flex;align-items:center;justify-content:center;border:2px solid #0B1220;box-shadow:0 2px 6px rgba(0,0,0,.5);}
  .wp-pin span{transform:rotate(45deg);font-family:'JetBrains Mono',monospace;font-size:10px;font-weight:700;color:#0B1220;}
  .leaflet-popup-content-wrapper{background:var(--panel-light);color:var(--text);border-radius:8px;}
  .leaflet-popup-tip{background:var(--panel-light);}
  .popup-inner{font-family:'Inter',sans-serif;}
  .popup-inner .pname{font-weight:600;font-size:13.5px;margin-bottom:2px;}
  .popup-inner .pcat{font-size:11px;color:var(--text-dim);margin-bottom:6px;}
  .popup-inner .pdir{margin-top:2px;display:inline-block;background:var(--accent);color:#1a1200;font-weight:600;font-size:11.5px;padding:5px 10px;border-radius:6px;text-decoration:none;}
  .popup-inner .pdir:hover{background:#ffb84d;}

  #master-qr{width:200px;height:200px;background:#fff;border-radius:10px;padding:10px;margin:0 auto 14px;display:flex;align-items:center;justify-content:center;}
  .link-row{display:flex;gap:6px;margin-bottom:12px;}
  .link-row input{flex:1;font-family:'JetBrains Mono',monospace;font-size:10.5px;}

  /* ---------- Modal ---------- */
  #modal-overlay{
    position:fixed;inset:0;background:rgba(5,8,16,.7);z-index:1000;
    display:none;align-items:center;justify-content:center;
  }
  #modal-box{
    background:var(--panel);border:1px solid var(--border);border-radius:12px;
    padding:22px;width:300px;box-shadow:0 20px 60px rgba(0,0,0,.6);
  }
  #modal-box h3{margin:0 0 6px;font-family:'Barlow Condensed',sans-serif;font-size:19px;font-weight:700;}
  #modal-box p{margin:0 0 14px;font-size:12.5px;color:var(--text-dim);line-height:1.5;}
  #modal-box input{
    width:100%;background:var(--panel-light);border:1px solid var(--border);color:var(--text);
    padding:9px 10px;border-radius:7px;font-size:13.5px;margin-bottom:10px;font-family:'JetBrains Mono',monospace;
  }
  #modal-box .row{display:flex;gap:8px;}
  #modal-box .row .btn{flex:1;text-align:center;}
  #modal-err{color:#f43f5e;font-size:11.5px;margin:-4px 0 10px;display:none;}

  #print-sheet{display:none;}
  @media print{
    #topbar,#main,#modal-overlay{display:none !important;}
    #print-sheet{
      display:flex !important;flex-direction:column;align-items:center;justify-content:center;
      height:100vh;background:#fff;color:#111;font-family:Arial,sans-serif;text-align:center;
    }
    #print-sheet img, #print-sheet canvas{width:260px;height:260px;margin-bottom:20px;}
    #print-sheet h2{margin:0 0 6px;font-size:24px;}
    #print-sheet p{margin:0;font-size:13px;color:#555;max-width:320px;}
  }

  ::-webkit-scrollbar{width:8px;}
  ::-webkit-scrollbar-thumb{background:var(--border);border-radius:4px;}
</style>
</head>
<body>

<div id="app">
  <div id="topbar">
    <div class="wordmark-wrap">
      <div class="wordmark"><span class="dot"></span>WAYPOINT</div>
      <span class="tagline" id="tagline-text">scan once, find any exact spot on campus</span>
    </div>

    <div id="searchbox">
      <input id="search-input" type="text" placeholder="Search college / area name…" />
      <button id="search-btn">Locate</button>
    </div>

    <div id="topbar-right">
      <button class="btn" id="owner-btn">🔒 Owner Login</button>
      <button class="btn btn-accent" id="toggle-add">＋ Add Waypoint</button>
      <button class="btn" id="share-btn">📱 Campus QR</button>
      <span id="status-msg"></span>
    </div>
  </div>

  <div id="main">
    <div id="map">
      <div id="viewer-banner">👁 Viewing only — tap a location below for exact walking directions</div>
      <div id="map-hint">Click the EXACT spot — this is what visitors will be navigated to</div>
      <div id="add-form">
        <h3>New Waypoint</h3>
        <div class="coord-preview" id="coord-preview">--, --</div>
        <label>Name</label>
        <input id="wp-name" type="text" placeholder="e.g. Boys Hostel — Block C" />
        <label>Category</label>
        <div class="cat-chips" id="wp-cat-chips"></div>
        <div class="row">
          <button class="btn" id="wp-cancel">Cancel</button>
          <button class="btn btn-accent" id="wp-confirm">Add Pin</button>
        </div>
      </div>
    </div>

    <div id="sidebar">
      <div id="sidebar-head">
        <h2>Waypoint Manifest</h2>
        <p id="wp-count">0 locations mapped</p>
      </div>
      <div id="wp-list"></div>
      <div id="sidebar-foot">
        <button class="btn" id="export-btn">⬇ Export list</button>
        <button class="btn" id="clear-btn">🗑 Clear all</button>
      </div>
    </div>
  </div>
</div>

<div id="print-sheet"></div>

<div id="modal-overlay">
  <div id="modal-box"></div>
</div>

<script>
/* ---------------- Config ---------------- */
const CATEGORIES = {
  gate:    { label: 'Main Gate / Entry',   color: '#38BDF8', code: 'GATE' },
  academic:{ label: 'Academic Block',      color: '#F5A623', code: 'ACAD' },
  hostel:  { label: 'Hostel / PG',         color: '#2DD4BF', code: 'HSTL' },
  hospital:{ label: 'Hospital / Medical',  color: '#F43F5E', code: 'MED'  },
  society: { label: 'Society / Building',  color: '#8B5CF6', code: 'SOC'  },
  other:   { label: 'Other',               color: '#94A3B8', code: 'PT'   },
};

const DEFAULT_CENTER = [19.0760, 72.8777]; // Mumbai fallback
let map, tempMarker = null, tempLatLng = null, addMode = false;
let waypoints = [];
let markerLayer = {};
let ownerPin = null;      // stored (shared) — the passcode the owner set
let isOwner = false;      // this session only
let mapTitle = '';        // stored (shared) — display name for this campus map
let userLoc = null;       // visitor's live GPS, used for distance + directions accuracy

/* ---------------- Modal helpers ---------------- */
function openModal(html){
  document.getElementById('modal-box').innerHTML = html;
  document.getElementById('modal-overlay').style.display = 'flex';
}
function closeModal(){
  document.getElementById('modal-overlay').style.display = 'none';
}
document.getElementById('modal-overlay').addEventListener('click', (e) => {
  if(e.target.id === 'modal-overlay') closeModal();
});

function modalError(msg){
  const el = document.getElementById('modal-err');
  if(el){ el.textContent = msg; el.style.display = 'block'; }
}

function openConfirmModal(title, body, onYes){
  openModal(
    '<h3>' + title + '</h3><p>' + body + '</p>' +
    '<div class="row"><button class="btn" id="m-no">Cancel</button>' +
    '<button class="btn btn-accent" id="m-yes">Confirm</button></div>'
  );
  document.getElementById('m-no').addEventListener('click', closeModal);
  document.getElementById('m-yes').addEventListener('click', () => { closeModal(); onYes(); });
}

function openOwnerModal(){
  if(!ownerPin){
    openModal(
      '<h3>Claim Owner Access</h3>' +
      '<p>Set a passcode. Anyone with this passcode can add, edit or delete waypoints — everyone else can only view and scan. Share it only with people you trust to manage the map.</p>' +
      '<input id="m-pin1" type="text" placeholder="Choose a passcode" />' +
      '<div id="modal-err"></div>' +
      '<div class="row"><button class="btn" id="m-cancel">Cancel</button>' +
      '<button class="btn btn-accent" id="m-set">Set & Log In</button></div>'
    );
    document.getElementById('m-cancel').addEventListener('click', closeModal);
    document.getElementById('m-set').addEventListener('click', async () => {
      const val = document.getElementById('m-pin1').value.trim();
      if(val.length < 4){ modalError('Use at least 4 characters.'); return; }
      ownerPin = val;
      isOwner = true;
      await saveOwnerPin();
      closeModal();
      updateOwnerUI();
      setStatus('You are now the map owner.');
    });
  } else {
    openModal(
      '<h3>Owner Login</h3>' +
      '<p>Enter the map passcode to unlock editing.</p>' +
      '<input id="m-pin2" type="text" placeholder="Passcode" />' +
      '<div id="modal-err"></div>' +
      '<div class="row"><button class="btn" id="m-cancel">Cancel</button>' +
      '<button class="btn btn-accent" id="m-login">Log In</button></div>'
    );
    document.getElementById('m-cancel').addEventListener('click', closeModal);
    document.getElementById('m-login').addEventListener('click', () => {
      const val = document.getElementById('m-pin2').value.trim();
      if(val !== ownerPin){ modalError('Incorrect passcode.'); return; }
      isOwner = true;
      closeModal();
      updateOwnerUI();
      setStatus('Editing unlocked.');
    });
  }
}

document.getElementById('tagline-text').addEventListener('click', async () => {
  if(!isOwner) return;
  const val = prompt('Name this campus map (shown on the printed QR poster):', mapTitle || '');
  if(val === null) return;
  mapTitle = val.trim();
  document.getElementById('tagline-text').textContent = mapTitle || 'scan once, find any exact spot on campus';
  await saveMapTitle();
});

document.getElementById('owner-btn').addEventListener('click', () => {
  if(isOwner){
    openConfirmModal('Log out?', 'You will go back to view-only mode on this device.', () => {
      isOwner = false;
      addMode = false;
      hideAddForm();
      updateOwnerUI();
      setStatus('Logged out — view only now.');
    });
  } else {
    openOwnerModal();
  }
});

function updateOwnerUI(){
  const btn = document.getElementById('owner-btn');
  btn.classList.toggle('is-owner', isOwner);
  btn.textContent = isOwner ? '🔓 Owner (logout)' : (ownerPin ? '🔒 Owner Login' : '🔑 Claim Owner Access');
  document.getElementById('toggle-add').style.display = isOwner ? 'inline-block' : 'none';
  document.getElementById('clear-btn').style.display = isOwner ? 'inline-block' : 'none';
  document.getElementById('viewer-banner').style.display = isOwner ? 'none' : 'block';
  const tag = document.getElementById('tagline-text');
  tag.style.cursor = isOwner ? 'pointer' : 'default';
  tag.title = isOwner ? 'Click to rename this campus map' : '';
  renderAllMarkers();
  renderList();
}

/* ---------------- Init map ---------------- */
function initMap(center){
  map = L.map('map', { zoomControl: true }).setView(center, 17);
  L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
    maxZoom: 20,
    attribution: '&copy; OpenStreetMap contributors'
  }).addTo(map);

  map.on('click', (e) => {
    if(!addMode || !isOwner) return;
    tempLatLng = e.latlng;
    if(tempMarker) map.removeLayer(tempMarker);
    tempMarker = L.marker(e.latlng).addTo(map);
    document.getElementById('coord-preview').textContent = e.latlng.lat.toFixed(6) + ', ' + e.latlng.lng.toFixed(6);
    document.getElementById('add-form').style.display = 'block';
    document.getElementById('wp-name').focus();
  });
}

function renderCategoryChips(container, selectedKey, onSelect){
  container.innerHTML = '';
  Object.entries(CATEGORIES).forEach(([key, c]) => {
    const chip = document.createElement('button');
    chip.type = 'button';
    chip.className = 'cat-chip' + (key === selectedKey ? ' active' : '');
    chip.textContent = c.label;
    chip.addEventListener('click', () => onSelect(key));
    container.appendChild(chip);
  });
}
let addSelectedCat = Object.keys(CATEGORIES)[0];
function refreshAddChips(){
  renderCategoryChips(document.getElementById('wp-cat-chips'), addSelectedCat, (key) => {
    addSelectedCat = key;
    refreshAddChips();
  });
}

/* ---------------- Add mode toggle ---------------- */
document.getElementById('toggle-add').addEventListener('click', () => {
  if(!isOwner){ openOwnerModal(); return; }
  addMode = !addMode;
  const btn = document.getElementById('toggle-add');
  btn.classList.toggle('active', addMode);
  btn.textContent = addMode ? '✕ Cancel Adding' : '＋ Add Waypoint';
  document.getElementById('map-hint').style.display = addMode ? 'block' : 'none';
  if(!addMode) hideAddForm();
});

function hideAddForm(){
  document.getElementById('add-form').style.display = 'none';
  document.getElementById('wp-name').value = '';
  if(tempMarker){ map.removeLayer(tempMarker); tempMarker = null; }
}

document.getElementById('wp-cancel').addEventListener('click', hideAddForm);

document.getElementById('wp-confirm').addEventListener('click', () => {
  const name = document.getElementById('wp-name').value.trim();
  const cat = addSelectedCat;
  if(!name || !tempLatLng){ return; }
  addWaypoint(name, cat, tempLatLng.lat, tempLatLng.lng);
  hideAddForm();
});

/* ---------------- Waypoint logic ---------------- */
function nextSeq(catKey){
  const count = waypoints.filter(w => w.cat === catKey).length + 1;
  return String(count).padStart(2,'0');
}

function addWaypoint(name, cat, lat, lng){
  const seq = nextSeq(cat);
  const wp = {
    id: 'wp_' + Date.now() + '_' + Math.floor(Math.random()*999),
    name, cat, lat, lng,
    code: CATEGORIES[cat].code + '-' + seq
  };
  waypoints.push(wp);
  saveWaypoints();
  renderMarker(wp);
  renderList();
}

function updateWaypoint(id, name, cat){
  const wp = waypoints.find(w => w.id === id);
  if(!wp) return;
  wp.name = name;
  if(wp.cat !== cat){
    wp.cat = cat;
    wp.code = CATEGORIES[cat].code + '-' + nextSeq(cat);
  }
  saveWaypoints();
  renderAllMarkers();
  renderList();
}

function moveWaypoint(id, lat, lng){
  const wp = waypoints.find(w => w.id === id);
  if(!wp) return;
  wp.lat = lat; wp.lng = lng;
  saveWaypoints();
  renderList();
}

function removeWaypoint(id){
  waypoints = waypoints.filter(w => w.id !== id);
  if(markerLayer[id]){ map.removeLayer(markerLayer[id]); delete markerLayer[id]; }
  saveWaypoints();
  renderList();
}

function mapsUrl(wp){
  // No origin specified on purpose — Google Maps auto-uses the visitor's live GPS
  // as the starting point, so directions are exact to this precise pin.
  return 'https://www.google.com/maps/dir/?api=1&destination=' + wp.lat.toFixed(6) + ',' + wp.lng.toFixed(6) + '&travelmode=walking';
}

function haversine(lat1, lng1, lat2, lng2){
  const R = 6371000;
  const toRad = d => d * Math.PI / 180;
  const dLat = toRad(lat2 - lat1), dLng = toRad(lng2 - lng1);
  const a = Math.sin(dLat/2)**2 + Math.cos(toRad(lat1)) * Math.cos(toRad(lat2)) * Math.sin(dLng/2)**2;
  return R * 2 * Math.atan2(Math.sqrt(a), Math.sqrt(1 - a));
}
function formatDist(m){
  return m < 1000 ? Math.round(m) + ' m away' : (m / 1000).toFixed(1) + ' km away';
}
function tryLocate(){
  if(!navigator.geolocation) return;
  navigator.geolocation.getCurrentPosition(
    pos => { userLoc = { lat: pos.coords.latitude, lng: pos.coords.longitude }; renderList(); },
    () => { /* permission denied or unavailable — fall back silently */ },
    { enableHighAccuracy: true, timeout: 8000 }
  );
}

function renderMarker(wp){
  const c = CATEGORIES[wp.cat];
  const icon = L.divIcon({
    className: '',
    html: '<div class="wp-pin" style="background:' + c.color + '"><span>' + c.code[0] + '</span></div>',
    iconSize: [26,26], iconAnchor: [13,26]
  });
  const marker = L.marker([wp.lat, wp.lng], { icon, draggable: isOwner }).addTo(map);
  const popupDiv = document.createElement('div');
  popupDiv.className = 'popup-inner';
  popupDiv.innerHTML = '<div class="pname">' + escapeHtml(wp.name) + '</div><div class="pcat">' + c.label + ' · ' + wp.code + (isOwner ? ' · drag pin to reposition' : '') + '</div><a class="pdir" href="' + mapsUrl(wp) + '" target="_blank" rel="noopener">🧭 Get Directions</a>';
  marker.bindPopup(popupDiv);
  if(isOwner){
    marker.on('dragend', (ev) => {
      const pos = ev.target.getLatLng();
      moveWaypoint(wp.id, pos.lat, pos.lng);
    });
  }
  markerLayer[wp.id] = marker;
}

function renderAllMarkers(){
  Object.values(markerLayer).forEach(m => map.removeLayer(m));
  markerLayer = {};
  waypoints.forEach(renderMarker);
}

function escapeHtml(s){
  return s.replace(/[&<>"']/g, m => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));
}

/* ---------------- Sidebar list ---------------- */
function renderList(){
  const list = document.getElementById('wp-list');
  const sortedByDist = !isOwner && userLoc;
  document.getElementById('wp-count').textContent = waypoints.length + (waypoints.length === 1 ? ' location mapped' : ' locations mapped') + (isOwner ? '' : (sortedByDist ? ' · nearest first' : ' · view only'));
  list.innerHTML = '';
  if(waypoints.length === 0){
    list.innerHTML = '<div id="empty-state">No waypoints yet.<br><br>' + (isOwner ?
      '<b>Click "＋ Add Waypoint"</b> then tap the exact spot — a hostel gate, hospital entrance, or society block — so visitors get pinpoint directions.' :
      "The map owner hasn't added any locations yet.") + '</div>';
    return;
  }

  let ordered;
  if(sortedByDist){
    ordered = waypoints.map(wp => ({ wp, d: haversine(userLoc.lat, userLoc.lng, wp.lat, wp.lng) }))
      .sort((a, b) => a.d - b.d).map(x => x.wp);
  } else {
    ordered = waypoints.slice().reverse();
  }

  ordered.forEach(wp => {
    const c = CATEGORIES[wp.cat];
    const coordLine = userLoc
      ? '<span class="ticket-dist">' + formatDist(haversine(userLoc.lat, userLoc.lng, wp.lat, wp.lng)) + '</span>'
      : wp.lat.toFixed(5) + ', ' + wp.lng.toFixed(5);
    const card = document.createElement('div');
    card.className = 'ticket';
    card.innerHTML =
      '<div class="stripe" style="background:' + c.color + '"></div>' +
      '<div class="ticket-body">' +
        '<div class="ticket-info" id="info-' + wp.id + '">' +
          '<div class="ticket-code">' + wp.code + '</div>' +
          '<div class="ticket-name">' + escapeHtml(wp.name) + '</div>' +
          '<div class="ticket-cat" style="background:' + c.color + '22;color:' + c.color + '">' + c.label + '</div>' +
          '<div class="ticket-coords">' + coordLine + '</div>' +
          '<div class="ticket-actions">' +
            '<a class="btn-dir" href="' + mapsUrl(wp) + '" target="_blank" rel="noopener">🧭 Directions</a>' +
            '<button data-act="focus" data-id="' + wp.id + '">📍 Focus</button>' +
            (isOwner ? '<button data-act="edit" data-id="' + wp.id + '">✎ Edit</button><button data-act="del" data-id="' + wp.id + '" class="danger">Delete</button>' : '') +
          '</div>' +
        '</div>' +
      '</div>';
    list.appendChild(card);
  });

  list.querySelectorAll('button').forEach(btn => {
    btn.addEventListener('click', () => {
      const id = btn.dataset.id;
      const wp = waypoints.find(w => w.id === id);
      if(!wp) return;
      if(btn.dataset.act === 'focus'){
        map.setView([wp.lat, wp.lng], 19);
        markerLayer[id].openPopup();
      } else if(btn.dataset.act === 'del'){
        openConfirmModal('Delete waypoint?', 'Remove "' + escapeHtml(wp.name) + '" from the map. This cannot be undone.', () => removeWaypoint(id));
      } else if(btn.dataset.act === 'edit'){
        openEditRow(wp);
      }
    });
  });
}

function openEditRow(wp){
  const info = document.getElementById('info-' + wp.id);
  if(!info) return;
  let editCat = wp.cat;
  const chipsId = 'edit-cat-chips-' + wp.id;
  info.innerHTML =
    '<div class="edit-row"><label>Name</label><input id="edit-name-' + wp.id + '" type="text" value="' + escapeHtml(wp.name).replace(/"/g,'&quot;') + '" /></div>' +
    '<div class="edit-row"><label>Category</label><div class="cat-chips" id="' + chipsId + '"></div></div>' +
    '<div class="ticket-actions">' +
      '<button data-save="' + wp.id + '">✓ Save</button>' +
      '<button data-cancel="' + wp.id + '">Cancel</button>' +
    '</div>';
  const chipsEl = document.getElementById(chipsId);
  function refreshEditChips(){
    renderCategoryChips(chipsEl, editCat, (key) => { editCat = key; refreshEditChips(); });
  }
  refreshEditChips();
  info.querySelector('[data-save]').addEventListener('click', () => {
    const newName = document.getElementById('edit-name-' + wp.id).value.trim();
    if(!newName) return;
    updateWaypoint(wp.id, newName, editCat);
  });
  info.querySelector('[data-cancel]').addEventListener('click', renderList);
}

/* ---------------- Single Campus QR (share modal + poster print) ---------------- */
let shareUrl = (location.protocol === 'http:' || location.protocol === 'https:') ? location.href : '';

function renderMasterQr(){
  const holder = document.getElementById('master-qr');
  if(!holder) return;
  holder.innerHTML = '';
  const err = document.getElementById('qr-url-err');
  if(!shareUrl){
    if(err){ err.style.display = 'block'; err.textContent = 'Enter the public web address this file is hosted at, then click Update.'; }
    return;
  }
  if(typeof QRCode === 'undefined'){
    if(err){ err.style.display = 'block'; err.textContent = 'QR library failed to load — check your internet connection and reload the page.'; }
    return;
  }
  if(err) err.style.display = 'none';
  new QRCode(holder, { text: shareUrl, width: 180, height: 180, colorDark: '#0B1220', colorLight: '#ffffff', correctLevel: QRCode.CorrectLevel.H });
}

function openShareModal(){
  openModal(
    '<h3>📱 Campus QR</h3>' +
    '<p>One QR for the whole campus. This only works if <b>this file is hosted at a real, public web address</b> — a QR pointing at a file on your own computer or an unpublished preview can\'t be reached by someone else\'s phone. Confirm the address below, then print the poster.</p>' +
    '<label style="font-size:10px;color:var(--text-dim);text-transform:uppercase;letter-spacing:.4px;display:block;margin-bottom:3px;">Public URL of this page</label>' +
    '<div class="link-row"><input id="share-link" type="text" placeholder="https://your-site.com/campus-map.html" value="' + (shareUrl ? shareUrl.replace(/"/g,'&quot;') : '') + '" /><button class="btn" id="update-link">Update</button></div>' +
    '<div id="qr-url-err" style="color:#f43f5e;font-size:11.5px;margin:-4px 0 10px;display:none;"></div>' +
    '<div id="master-qr"></div>' +
    '<div class="row"><button class="btn" id="copy-link">Copy link</button><button class="btn" id="m-close">Close</button></div>' +
    '<div class="row" style="margin-top:8px;"><button class="btn btn-accent" id="m-print" style="width:100%;">🖨 Print Poster</button></div>'
  );
  renderMasterQr();
  document.getElementById('m-close').addEventListener('click', closeModal);
  document.getElementById('update-link').addEventListener('click', () => {
    shareUrl = document.getElementById('share-link').value.trim();
    renderMasterQr();
  });
  document.getElementById('copy-link').addEventListener('click', async () => {
    if(!shareUrl){ setStatus('Enter the public URL first.'); return; }
    try{ await navigator.clipboard.writeText(shareUrl); setStatus('Link copied.'); }
    catch(err){ setStatus('Could not copy — copy the link manually.'); }
  });
  document.getElementById('m-print').addEventListener('click', () => {
    if(!shareUrl){ setStatus('Enter the public URL first, then print.'); return; }
    closeModal();
    printPoster();
  });
}
function printPoster(){
  const sheet = document.getElementById('print-sheet');
  sheet.innerHTML = '<div class="poster-qr"></div><h2>' + escapeHtml(mapTitle || 'Campus Map') + '</h2><p>Scan to open the map — tap any location for exact walking directions</p>';
  new QRCode(sheet.querySelector('.poster-qr'), { text: shareUrl, width: 260, height: 260, colorDark:'#111', colorLight:'#ffffff', correctLevel: QRCode.CorrectLevel.H });
  setTimeout(() => window.print(), 250);
}
document.getElementById('share-btn').addEventListener('click', () => {
  if(waypoints.length === 0){ setStatus('Add at least one waypoint before sharing the campus QR.'); return; }
  openShareModal();
});

/* ---------------- Export ---------------- */
document.getElementById('export-btn').addEventListener('click', () => {
  if(waypoints.length === 0){ setStatus('Nothing to export yet.'); return; }
  const rows = ['code,name,category,lat,lng,maps_url'];
  waypoints.forEach(wp => {
    rows.push([wp.code, '"'+wp.name.replace(/"/g,'""')+'"', CATEGORIES[wp.cat].label, wp.lat, wp.lng, mapsUrl(wp)].join(','));
  });
  const blob = new Blob([rows.join('\n')], {type:'text/csv'});
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url;
  a.download = 'campus_waypoints.csv';
  a.style.display = 'none';
  document.body.appendChild(a);
  a.click();
  document.body.removeChild(a);
  setTimeout(() => URL.revokeObjectURL(url), 1000);
  setStatus('CSV exported (' + waypoints.length + ' waypoints).');
});

document.getElementById('clear-btn').addEventListener('click', () => {
  if(!isOwner){ openOwnerModal(); return; }
  if(waypoints.length === 0){ setStatus('Nothing to clear.'); return; }
  openConfirmModal('Clear all waypoints?', 'This removes all ' + waypoints.length + ' waypoints and their QR tags for everyone viewing this map. This cannot be undone.', () => {
    waypoints = [];
    saveWaypoints();
    renderAllMarkers();
    renderList();
    setStatus('All waypoints cleared.');
  });
});

/* ---------------- Search / geocode ---------------- */
async function geocode(query){
  setStatus('Searching…');
  try{
    const res = await fetch('https://nominatim.openstreetmap.org/search?format=json&limit=1&q=' + encodeURIComponent(query));
    const data = await res.json();
    if(data && data.length){
      const lat = parseFloat(data[0].lat), lon = parseFloat(data[0].lon);
      map.setView([lat, lon], 17);
      setStatus('Found: ' + data[0].display_name.split(',').slice(0,2).join(','));
    } else {
      setStatus('No match — click the map to place a pin manually.');
    }
  } catch(err){
    setStatus('Search unavailable — click the map directly instead.');
  }
}
document.getElementById('search-btn').addEventListener('click', () => {
  const q = document.getElementById('search-input').value.trim();
  if(q) geocode(q);
});
document.getElementById('search-input').addEventListener('keydown', (e) => {
  if(e.key === 'Enter'){ e.preventDefault(); document.getElementById('search-btn').click(); }
});

function setStatus(msg){
  const el = document.getElementById('status-msg');
  el.textContent = msg;
  clearTimeout(setStatus._t);
  setStatus._t = setTimeout(() => { el.textContent = ''; }, 5000);
}

/* ---------------- Persistence ---------------- */
// Uses window.storage when available (Claude artifact preview), and always
// mirrors to localStorage so data survives reloads when this file is hosted
// or opened as a standalone page — window.storage doesn't exist there.
async function storageGet(key, shared){
  try{
    if(window.storage){
      const res = await window.storage.get(key, shared);
      if(res && res.value !== undefined && res.value !== null) return res.value;
    }
  } catch(err){ /* window.storage unavailable outside Claude — fall through */ }
  try{ return localStorage.getItem('waypoint_' + key); }
  catch(err){ return null; }
}
async function storageSet(key, value, shared){
  try{ if(window.storage) await window.storage.set(key, value, shared); }
  catch(err){ /* window.storage unavailable outside Claude — fine, localStorage still runs */ }
  try{ localStorage.setItem('waypoint_' + key, value); }
  catch(err){ console.error('localStorage save failed', err); }
}

async function saveWaypoints(){ await storageSet('campus-waypoints', JSON.stringify(waypoints), true); }
async function loadWaypoints(){
  const val = await storageGet('campus-waypoints', true);
  waypoints = val ? JSON.parse(val) : [];
}
async function saveOwnerPin(){ await storageSet('owner-pin', ownerPin, true); }
async function loadOwnerPin(){ ownerPin = await storageGet('owner-pin', true); }
async function saveMapTitle(){ await storageSet('campus-title', mapTitle, true); }
async function loadMapTitle(){ mapTitle = (await storageGet('campus-title', true)) || ''; }

/* ---------------- Boot ---------------- */
(async function boot(){
  refreshAddChips();
  initMap(DEFAULT_CENTER);
  await loadOwnerPin();
  await loadMapTitle();
  await loadWaypoints();
  if(mapTitle){ document.getElementById('tagline-text').textContent = mapTitle; }
  updateOwnerUI();
  tryLocate();
  setStatus(ownerPin ? 'Search your college, then log in as owner to add exact locations.' : 'Search your college, then claim owner access to start pinning exact locations.');
})();
</script>
